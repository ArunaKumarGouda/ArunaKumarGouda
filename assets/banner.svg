<svg width="1100" height="300" viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1226"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <!-- background -->
  <rect width="1100" height="300" rx="18" fill="url(#bgGrad)"/>
  <rect width="1100" height="300" rx="18" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- neon border -->
  <rect x="3" y="3" width="1094" height="294" rx="16" fill="none" stroke="url(#neonGrad)" stroke-width="2" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- floating particles -->
  <circle cx="80" cy="60" r="3" fill="#38bdf8" filter="url(#softBlur)">
    <animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="220" r="2.5" fill="#22d3ee" filter="url(#softBlur)">
    <animate attributeName="cy" values="220;195;220" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="50" r="3" fill="#0ea5e9" filter="url(#softBlur)">
    <animate attributeName="cy" values="50;75;50" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="960" cy="240" r="2" fill="#7dd3fc" filter="url(#softBlur)">
    <animate attributeName="cy" values="240;215;240" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="30" r="2" fill="#38bdf8" filter="url(#softBlur)">
    <animate attributeName="cx" values="550;600;550" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- faint code lines (glassmorphism panel) -->
  <g opacity="0.16" font-family="monospace" font-size="12" fill="#7dd3fc">
    <text x="40" y="100">public class Developer {</text>
    <text x="60" y="118">while (true) build();</text>
    <text x="40" y="136">}</text>
    <text x="830" y="270">const passion = "code";</text>
  </g>

  <!-- rotating ring (react-style orbit) -->
  <g transform="translate(970,150)">
    <ellipse cx="0" cy="0" rx="55" ry="20" fill="none" stroke="#38bdf8" stroke-width="1.4" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="55" ry="20" fill="none" stroke="#22d3ee" stroke-width="1.4" opacity="0.7" transform="rotate(60)">
      <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="55" ry="20" fill="none" stroke="#0ea5e9" stroke-width="1.4" opacity="0.7" transform="rotate(120)">
      <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
  </g>

  <!-- neural network hint -->
  <g stroke="#0ea5e9" stroke-width="1" opacity="0.5">
    <line x1="820" y1="60" x2="870" y2="90"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/></line>
    <line x1="820" y1="120" x2="870" y2="90"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/></line>
    <line x1="870" y1="90" x2="915" y2="70"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/></line>
  </g>
  <circle cx="820" cy="60" r="3" fill="#22d3ee"/>
  <circle cx="820" cy="120" r="3" fill="#22d3ee"/>
  <circle cx="870" cy="90" r="4" fill="#38bdf8"/>
  <circle cx="915" cy="70" r="3" fill="#22d3ee"/>

  <!-- main name -->
  <text x="55" y="150" font-family="Segoe UI, Verdana, sans-serif" font-size="46" font-weight="700" fill="url(#textGrad)">
    Aruna Kumar Gouda
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- subtitle -->
  <text x="57" y="185" font-family="Segoe UI, Verdana, sans-serif" font-size="18" fill="#94a3b8">
    Java Full Stack Developer · Python Developer · AI Enthusiast
  </text>

  <!-- tagline -->
  <text x="57" y="215" font-family="monospace" font-size="14" fill="#38bdf8">
    Building clean, scalable software — one commit at a time.
  </text>

  <!-- CTA pills -->
  <g font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">
    <rect x="57" y="235" width="150" height="34" rx="17" fill="none" stroke="url(#neonGrad)" stroke-width="1.5"/>
    <text x="132" y="257" fill="#e0f2fe" text-anchor="middle">View Projects</text>

    <rect x="222" y="235" width="150" height="34" rx="17" fill="url(#neonGrad)" opacity="0.9"/>
    <text x="297" y="257" fill="#020617" text-anchor="middle">Let's Connect</text>
  </g>
</svg>
